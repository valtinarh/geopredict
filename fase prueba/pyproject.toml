[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geopredict"
version = "0.2.0"
description = "Generación de radargramas sintéticos para GEOPREDICT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.6", "pandas>=2.0"]

[tool.setuptools]
packages = ["geopredict"]

[tool.setuptools.package-data]
geopredict = ["config/*.json", "config/*.geojson"]
