[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geopredict"
version = "0.1.0"
description = "Generación de radargramas sintéticos para GEOPREDICT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.6"]

[tool.setuptools]
packages = ["geopredict"]
